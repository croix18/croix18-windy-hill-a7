<title>A7 Unit 3 Practice Test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>/* Practice-test kit: the page (from the A7 Unit 3 sheet, 10–12 Oct 2026; Apple review fixes 15 Oct) */
/* One sheet of paper on a desk, a stopwatch pinned above it; whatever is written on the sheet is in pen blue. */
:root{
  --ground:#e9ecf1; --paper:#ffffff; --ink:#15171c; --mut:#5a6270; --rule:#c9ced8; --field:#f4f6fa;
  --pen:#1a3f95; --ok:#1b7a45; --no:#b3261e; --warn:#8a5200; --bar:#ffffff; --shadow:0 1px 2px rgba(20,30,60,.08),0 8px 28px rgba(20,30,60,.08);
  --serif:"Tinos","Times New Roman",Times,"Liberation Serif",serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media screen and (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0f1116; --paper:#1a1d24; --ink:#e7e9ee; --mut:#9aa2b1; --rule:#353a46; --field:#232733;
  --pen:#93b4ff; --ok:#6fd39b; --no:#ff8f85; --warn:#f2bb62; --bar:#1a1d24; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark } }
@media screen{ :root[data-theme="dark"]{
  --ground:#0f1116; --paper:#1a1d24; --ink:#e7e9ee; --mut:#9aa2b1; --rule:#353a46; --field:#232733;
  --pen:#93b4ff; --ok:#6fd39b; --no:#ff8f85; --warn:#f2bb62; --bar:#1a1d24; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark } }
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.4;padding-inline:16px;padding-block:0 56px}
button{font:600 14px/1 var(--ui);color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:8px;padding:9px 13px;cursor:pointer}
button:hover{border-color:var(--mut)} button:focus-visible,input:focus-visible,textarea:focus-visible,.ch input:focus-visible+.box{outline:2px solid var(--pen);outline-offset:2px}
button.go{background:var(--pen);border-color:var(--pen);color:var(--paper)}
button[disabled]{opacity:.5;cursor:default}

/* the stopwatch */
.watch{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:8px 16px;background:var(--bar);border-bottom:1px solid var(--rule);font-family:var(--ui)}
.watch .in{max-width:46rem;margin:0 auto;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.time{font:700 26px/1 var(--ui);font-variant-numeric:tabular-nums;letter-spacing:.01em;min-width:4.2ch}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.bar{height:3px;background:var(--rule);margin:8px -16px -8px}
.bar i{display:block;height:100%;width:0;background:var(--pen)}
.confirm{flex-basis:100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut)}

/* the sheet */
.sheet{max-width:46rem;margin:20px auto 0;background:var(--paper);box-shadow:var(--shadow);padding:28px clamp(16px,5vw,44px) 40px}
.eyebrow{font:500 11.5px/1.3 var(--serif);letter-spacing:.09em;color:var(--mut);text-transform:uppercase}
.head{display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;align-items:flex-start}
h1{font:700 23px/1.2 var(--serif);margin:4px 0 2px;text-wrap:balance}
.total{font-style:italic;color:var(--mut);font-size:14.5px}
.rules{border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);height:18px;margin:14px 0 8px}
.how{font-size:14.5px;margin:0 0 6px} .how.i{font-style:italic;color:var(--mut)} .how.b{font-weight:700}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1.5px solid var(--ink);margin:30px 0 14px;padding-bottom:2px}
h2{font:700 18px/1.25 var(--serif);margin:0}
.pts,.pt{font-style:italic;color:var(--mut);font-size:14px;white-space:nowrap}
.q{margin:0 0 24px}
.stem,.line{display:flex;gap:10px;align-items:baseline}
.num{min-width:1.9em;font-weight:700} .lab{min-width:1.4em;font-weight:700}
.st{flex:1 1 auto;min-width:0}
.prt{margin:12px 0 0 calc(1.9em + 10px)} .prt.solo{margin-top:8px}
.ans{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.prt:not(.solo) .ans{margin-left:calc(1.4em + 10px)}
input[type=text],textarea{font:17px/1.35 var(--serif);color:var(--pen);background:var(--field);border:0;border-bottom:1.5px solid var(--rule);border-radius:6px 6px 0 0;padding:7px 9px;width:min(100%,17rem)}
textarea{width:100%;resize:vertical;min-height:4.6em}
input[readonly],textarea[readonly]{background:transparent}
.pv{color:var(--pen);font-size:1.05em;min-height:1em}
.keys{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%}
.keys button{font:600 16px/1 var(--serif);padding:7px 0;width:38px;border-radius:7px}
.choices{margin:8px 0 0 calc(1.9em + 10px);display:grid;gap:4px}
.ch{display:flex;align-items:center;gap:10px;padding:5px 6px;margin-left:-6px;border-radius:7px;cursor:pointer;min-height:36px}
.ch input{position:absolute;opacity:0;width:1px;height:1px}
.box{flex:0 0 auto;width:15px;height:15px;border:1.3px solid var(--ink);border-radius:50%;display:grid;place-items:center}
.box.sq{border-radius:2px}
.ch input:checked+.box{background:var(--pen);border-color:var(--pen);box-shadow:inset 0 0 0 2.5px var(--paper)}
.ch input:checked~.cv,.ch input:checked~.cl{color:var(--pen)}
.cl{min-width:1.3em}
.done .ch{cursor:default}

/* mathematics */
.m{white-space:nowrap;font-size:1.1em}
.m i{font-style:italic;padding-inline:.02em}
.m sup{font-size:.66em;vertical-align:.62em;line-height:0;margin-left:.03em}
.m sup.tall{vertical-align:1.35em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.12;margin:0 .14em}
.fr .n{border-bottom:1px solid currentColor;padding:0 .22em .08em}
.fr .d{padding:.08em .22em 0}
.bp{display:inline-block;transform:scaleY(2.05);font-weight:400;vertical-align:.02em}
.op{margin:0 .2em} .rel{margin:0 .3em}
.st .m{margin:0 .18em}

/* after Finish */
.key{margin-top:7px;font-size:15.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.prt:not(.solo) .key{margin-left:calc(1.4em + 10px)}
.q>.key{margin-left:calc(1.9em + 10px)}
.kl{font:700 10.5px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);border:1px solid var(--rule);border-radius:4px;padding:3px 5px}
.kv{flex:1 1 12rem;min-width:0}
.result{max-width:46rem;margin:20px auto 0;background:var(--paper);box-shadow:var(--shadow);padding:22px clamp(16px,5vw,44px);font-family:var(--ui)}
.result h2{font:700 12px/1 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:0 0 12px}
.big{display:flex;gap:14px 40px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.big div{min-width:0} .big b{display:block;font:700 40px/1 var(--ui);font-variant-numeric:tabular-nums} .big span{font-size:13px;color:var(--mut)}
.tw{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 10px 7px 0;border-bottom:1px solid var(--rule)} th{font-weight:600;color:var(--mut);font-size:12px}
td.r,th.r{text-align:right;padding-right:0}
.note{font-size:13px;color:var(--mut);margin:12px 0 0}
@media (prefers-reduced-motion:no-preference){ .bar i{transition:width .3s} }


/* ---- practice additions (the base is the unit test page's sheet) ---- */
.fr .nu{border-bottom:1px solid currentColor;padding:0 .22em .08em}
.fr .de{padding:.08em .22em 0}
.watch .set{font:600 13px/1 var(--ui);color:var(--mut);white-space:nowrap}
.score{font:600 13px/1.3 var(--ui);color:var(--mut);flex:1 1 9rem;min-width:0}
.score b{color:var(--ink)}
.mode{display:flex;gap:0;border:1px solid var(--rule);border-radius:9px;overflow:hidden;width:max-content;max-width:100%;margin:14px 0 0;font-family:var(--ui)}
.mode button{border:0;border-radius:0;background:transparent;padding:9px 12px;font-size:13.5px;color:var(--mut)}
.mode button[aria-pressed=true]{background:var(--pen);color:var(--paper)}
.setrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0 0;font:13.5px/1.3 var(--ui);color:var(--mut)}
.setrow input{font:600 15px/1 var(--ui);width:6.5rem;color:var(--ink);padding:7px 8px}
.chk{padding:8px 12px}
.ans input[type=text]{flex:1 1 8rem;min-width:0;max-width:15rem}
.ans .pv{flex-basis:100%} .ans .pv:empty{display:none}
.steps p.one{margin:0}
.keys button{width:36px}
.ans .pre{font-style:italic;color:var(--ink)}
.fb{margin:8px 0 0;font:14.5px/1.45 var(--ui);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.prt:not(.solo) .fb,.prt:not(.solo) .more,.prt:not(.solo) .steps{margin-left:calc(1.4em + 10px)}
.q>.fb,.q>.more,.q>.steps{margin-left:calc(1.9em + 10px)}
.tag{font:700 12.5px/1 var(--ui);padding:4px 7px;border-radius:5px;white-space:nowrap}
.tag.ok{color:var(--ok);border:1px solid var(--ok)} .tag.no{color:var(--no);border:1px solid var(--no)} .tag.fm{color:var(--warn);border:1px dashed var(--warn)}
.fb .msg{flex:1 1 14rem;min-width:0}
.more{margin-top:6px}
.more button{padding:6px 10px;font-size:12.5px}
.steps{margin-top:8px;background:var(--field);border-radius:8px;padding:10px 12px;font-size:15.5px}
.steps ol{margin:0;padding-left:1.25em} .steps li{margin:2px 0}
.steps .key{margin:8px 0 0;font-size:15.5px}
.steps .ok{color:var(--ok);font-weight:700} .steps .no{color:var(--no);font-weight:700}
.is-right>.ans input[type=text]{border-bottom-color:var(--ok)}
.is-wrong>.ans input[type=text]{border-bottom-color:var(--no)}
.is-form>.ans input[type=text]{border-bottom-color:var(--warn)}
.choices .ch.picked-no .cv{text-decoration:line-through;text-decoration-color:var(--no)}
.choices .ch.is-key{outline:1.5px solid var(--ok);outline-offset:-1px}
.q>.ckrow{margin:8px 0 0 calc(1.9em + 10px)}
.result table td:first-child{white-space:normal}
.big small{font-size:.5em;font-weight:600}
.hidechk .chk,.hidechk .ckrow{display:none}
@media (max-width:480px){ .prt{margin-left:0} .choices,.q>.ckrow,.q>.fb,.q>.more,.q>.steps{margin-left:0} }
@media (max-width:420px){ .time{font-size:22px} .watch .in{gap:8px 10px} .mode button{padding:8px 9px;font-size:12.5px} }

/* ---- coaching ---- */
.fb{align-items:flex-start}
.fbx{flex:1 1 100%;min-width:0;font:14.5px/1.5 var(--ui)}
.fbx p{margin:2px 0 0} .fbx ul{margin:2px 0 0;padding-left:1.15em} .fbx li{margin:2px 0}
.fbx .rule{margin-top:6px;padding:7px 10px;border-left:3px solid var(--pen);background:var(--field);border-radius:0 6px 6px 0}
.fbx .where{color:var(--mut);font-size:13.5px}
.fbx .m{font-size:1.05em}
.more{display:flex;gap:8px;flex-wrap:wrap}
.more .cnt{font-weight:500;color:var(--mut);margin-left:3px;font-size:11.5px}
.solhead{display:flex;gap:8px;align-items:baseline;margin:0 0 6px}
ol.sol{margin:0;padding-left:1.35em}
ol.sol li{margin:0 0 8px;padding:4px 6px 4px 4px;border-radius:6px}
ol.sol .say{font-size:15px;line-height:1.45}
ol.sol .ex{margin-top:3px;font-size:16px}
ol.sol li.off{background:color-mix(in srgb,var(--no) 9%,transparent);outline:1px dashed var(--no)}
ol.sol .offnote{font:600 12.5px/1.3 var(--ui);color:var(--no);margin-top:4px}

.setrow select{font:600 14px/1.2 var(--ui);color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;max-width:100%;flex:1 1 14rem}
.again{margin-top:10px}
.xq{border:1.5px dashed var(--pen);border-radius:10px;padding:10px 12px 12px;margin:0;background:color-mix(in srgb,var(--pen) 4%,transparent)}
.xq .prt,.xq .choices,.xq>.ckrow,.xq>.fb,.xq>.more,.xq>.steps{margin-left:0}
.xq .prt:not(.solo) .ans,.xq .prt:not(.solo) .fb,.xq .prt:not(.solo) .more,.xq .prt:not(.solo) .steps,.xq .prt:not(.solo) .work{margin-left:0}
.xhead{font:700 12.5px/1.3 var(--ui);color:var(--pen);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.streak{text-transform:none;letter-spacing:0;color:var(--ok);margin-left:6px}
.wok,.wno,.wq{display:inline-block;width:1.4em;font-weight:700} .wok{color:var(--ok)} .wno{color:var(--no)} .wq{color:var(--warn)}
.wfin,.wnext{font:14.5px/1.45 var(--ui);margin:8px 0 0} .wfin.done{color:var(--ok);font-weight:600}
details.why{margin:0 0 10px;border:1px solid var(--rule);border-radius:8px;padding:6px 10px;background:var(--paper)}
details.why summary{cursor:pointer;font:600 13.5px/1.4 var(--ui);color:var(--pen)}
.vis{margin-top:8px}
.vcap{font:14px/1.5 var(--ui);margin:8px 0 2px}

/* ---- walk me through it ---- */
.walk{margin-top:8px;border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--field)}
.prt:not(.solo) .walk{margin-left:calc(1.4em + 10px)} .q>.walk{margin-left:calc(1.9em + 10px)}
@media (max-width:480px){ .prt:not(.solo) .walk,.q>.walk{margin-left:0} }
ol.wsteps{margin:4px 0 0;padding-left:1.3em;font:15px/1.45 var(--ui)}
ol.wsteps li{margin:0 0 10px}
ol.wsteps li.cur .wask{font-weight:600}
.wask .m{font-size:1.05em}
.wopts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.wopt{text-align:left;font:500 14.5px/1.35 var(--ui);background:var(--paper);padding:9px 12px}
.wopt.bad{text-decoration:line-through;text-decoration-color:var(--no);opacity:.6}
.wnum{display:flex;gap:8px;margin-top:6px;align-items:center}
.wnum input{font:17px/1.3 var(--serif);color:var(--pen);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;width:9rem}
.wwhy{margin-top:6px;font-size:14px}
.wgot{margin-top:3px;color:var(--mut)}
.walk .wkhead{flex-direction:row;align-items:center;justify-content:space-between;gap:8px}
.walk .wclose{padding:5px 10px;font-size:12.5px;width:auto;flex:0 0 auto}
.wpic{margin-top:8px;border:1px solid var(--rule);border-radius:8px;padding:6px 10px;background:var(--paper)} .wpl{font:600 13px/1.4 var(--ui);color:var(--pen)}

/* ==== Apple review, 15 Oct 2026 ==== */
[hidden]{display:none!important}                                   /* [R1-1] display:flex no longer beats hidden */
:root{--i1:42px;--i2:34px}                                         /* [R1-13] one indent in px for every line under a question */
body{margin:0}
.num{min-width:32px} .lab{min-width:24px}
.prt{margin-left:var(--i1)} .prt:not(.solo) .ans,.prt:not(.solo) .fb,.prt:not(.solo) .more,.prt:not(.solo) .steps,.prt:not(.solo) .walk,.prt:not(.solo) .key,.prt.mcp .choices,.prt.mcp>.ckrow{margin-left:var(--i2)}
.choices,.q>.mcp>.ckrow,.q>.mcp>.fb,.q>.mcp>.more,.q>.mcp>.steps,.q>.mcp>.walk{margin-left:var(--i1)}
.fb:empty,.more:empty{margin:0} .more:empty{display:none}
/* the bar: one row — time, score, Pause/Resume, Finish [J-2] */
.watch .in{flex-wrap:nowrap}
.watch .score{flex:1 1 auto}
.nw{white-space:nowrap}
body.asking .watch .btns{display:none}                              /* [R2-N6] one Finish at a time */
.confirm{flex-wrap:wrap} .watch .in:has(.confirm:not([hidden])){flex-wrap:wrap}
/* arrival [J-1] */
.intro{font-size:15px;margin:10px 0 0;line-height:1.45}
.pinote{display:block;font:600 13.5px/1.4 var(--ui);color:var(--pen);margin-top:4px}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 0;font-family:var(--ui)}
.ctl .mode{margin:0}
.ctl select{font:600 14px/1.2 var(--ui);color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:8px;padding:10px;min-height:44px;flex:1 1 13rem;max-width:100%}
details.setbox{margin:10px 0 0;font:13.5px/1.3 var(--ui);color:var(--mut)}
details.setbox summary{cursor:pointer;min-height:32px;display:flex;align-items:center;gap:6px;width:max-content;max-width:100%}
details.setbox summary b{color:var(--ink)} details.setbox summary .chg{color:var(--pen);font-weight:600}
details.setbox .setrow{margin-top:6px}
.notice{font:600 13.5px/1.4 var(--ui);color:var(--warn);margin:10px 0 0}
/* tap targets [R1-7] */
.more{gap:10px;margin-top:10px}
.more button,.walk .wclose,.mode button,.chk,.wnum button,.wgive button,.btns button,.setrow button{min-height:44px}
.more button{padding:8px 14px;font-size:13.5px}
.walk .wclose{padding:8px 14px;font-size:13px}
.keys button{min-height:44px;width:44px;font-size:17px}
.ch{min-height:44px;align-items:baseline;padding:9px 6px}                /* [R1-13] the letter lines up with a choice's first line */
.ch .box{align-self:flex-start;margin-top:.22em}
.wopt{min-height:44px}
/* feedback */
.fbx p .tag{margin-right:4px}
.fbx .note2{color:var(--mut);font-size:13.5px}
.tag.ok{font-size:13px}
.rd{flex-basis:100%;font:13px/1.35 var(--ui);color:var(--warn)} .rd:empty{display:none}
.xq input[type=text]{background:var(--paper)}                       /* [R1-12] */
.sthead{font:700 12.5px/1.3 var(--ui);color:var(--pen);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.steps:focus{outline:none}
.wgive{margin-top:8px} .wgave{color:var(--mut);font-size:12.5px}
.pts.alldone{color:var(--ok);font-weight:600}
.ans .pre{font-style:italic;color:var(--ink)} .ans .unit{font:16px/1 var(--serif);color:var(--mut);align-self:center;white-space:nowrap}
/* the end [J-6][J-10] */
.result:focus{outline:none}
.result .perfect{font:700 17px/1.3 var(--ui);color:var(--ok);margin:0 0 12px}
.result .last{font-size:13.5px;color:var(--mut);margin:-6px 0 14px}
.result .jump{min-height:36px;padding:6px 10px;margin:2px 2px 0 0;font-size:13px}
.result .btns{margin-top:14px}
/* print [R2-N7] */
@media print{
  :root,:root[data-theme="dark"]{--ground:#fff;--paper:#fff;--ink:#000;--mut:#444;--rule:#999;--field:#fff;--pen:#1a3f95;--ok:#1b7a45;--no:#b3261e;--warn:#8a5200;--bar:#fff;--shadow:none;color-scheme:light}
  .watch,.ctl,details.setbox,.keys,.more,.confirm,.ckrow,.chk,.walk,.btns,.notice{display:none!important}
  body{background:#fff} .sheet,.result{box-shadow:none;margin:0 auto;padding:0}
  .q{break-inside:avoid}
}
@media (max-width:480px){ :root{--i1:0px} .prt{margin-left:0} .watch .time{font-size:22px} }
.watch .btns{flex-wrap:nowrap;flex:0 0 auto}
@media (max-width:480px){ .watch .btns button{padding:8px 11px} .watch .score{font-size:12.5px} }

/* closing check, 16 Oct */
.result .jump,details.setbox summary{min-height:44px}
details.why summary{min-height:44px;display:flex;align-items:center}
.walk .wkhead{display:flex;align-items:center;justify-content:space-between;gap:8px;font:14px/1.4 var(--ui);margin-bottom:8px}
.keys{margin:8px 0 2px}                                             /* the keypad sits above the box: moving down the page it never shifts the box being tapped */
.prt:not(.solo)>.keys{margin-left:var(--i2)}
/* A7 Unit 3: the counting pictures (visual.js) */
.vrow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:4px 0}
.vgrp{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center;position:relative;padding-bottom:16px}
.vlab{position:absolute;left:0;right:0;bottom:0;text-align:center;font:600 11px/1 var(--ui);color:var(--mut)}
.vop{font-size:20px;margin:0 4px}
.vrl{font:600 11px/1 var(--ui);color:var(--mut);width:3.6em}
.tile{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 4px;border-radius:6px;font:600 14px/1 var(--serif);border:1.5px solid}
.tile.a{border-color:var(--pen);color:var(--pen);background:color-mix(in srgb,var(--pen) 10%,transparent)}
.tile.b{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}

<script>/* Practice-test kit: core. Shared by every unit's engine (in the page and under Node).
   - slot streams: each question slot draws from its own random stream, seeded by (unit, set, slot), so a change to one
     question never moves the numbers of another, and "set 4821" stays the same set as long as the unit's contentVersion
     does (the lock check holds that);

function gcd(a, b) { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) { const t = a % b; a = b; b = t; } return a; }

  const other = which === 0 ? b : a, term = p => which === 0 ? S(p) + ' × ' + S(other) : S(other) + ' × ' + S(p);
  return 'Break it up: ' + S(a) + ' × ' + S(b) + ' = ' + parts.map(term).join(' + ') + ' = ' + parts.map(p => S(qmul(p, other))).join(' + ') + '. Now add.';
}
/* a ÷ b: a nearby multiple of b as a stepping stone */
function hintDiv(a, b) {
  const qq = qdiv(a, b);

    let parts = split(a);

    return 'Half of ' + S(a) + ': ' + parts.map(p => 'half of ' + S(p) + ' is ' + S(qdiv(p, Q(2)))).join(', and ') + '. Now add.';
  }
  if (isInt(qq) && qq.n >= 10n) { const ten = Q((qq.n / 10n) * 10n); if (ten.n !== qq.n) return 'Think: ' + S(b) + ' × ? = ' + S(a) + '. Start with ' + S(b) + ' × ' + S(ten) + ' = ' + S(qmul(b, ten)) + '; ' + S(a) + ' − ' + S(qmul(b, ten)) + ' = ' + S(qsub(a, qmul(b, ten))) + ' is left.'; }
  if (places(b) > 0) { const k = 10n ** BigInt(places(b)); return 'Move both decimal points ' + places(b) + ' place' + (k === 10n ? '' : 's') + ': ' + S(a) + ' ÷ ' + S(b) + ' is the same as ' + S(qmul(a, Q(k))) + ' ÷ ' + S(qmul(b, Q(k))) + '.'; }
  return 'Think: ' + S(b) + ' × ? = ' + S(a) + '.';
}

  if (isInt(a) && isInt(b)) { const p = split(b); if (p.length < 2) return 'Count on from ' + S(a) + ' by ' + S(b) + '.'; return S(a) + ' + ' + S(b) + ' = ' + S(a) + ' + ' + p.map(S).join(' + ') + ' = ' + S(qadd(a, p[0])) + ' + ' + S(p[1]) + '.'; }

<script>/* A7 Unit 3 practice test engine: question generators, exact arithmetic, a reader for typed answers,
   and the marking rules. Runs in the page and under Node (the checks in test_engine.js and verify.py). */
(function (root) {
'use strict';
const KIT = (typeof module !== 'undefined' && module.exports) ? require('../kit/core.js') : root.Kit;

/* ------------------------------------------------------------------ exact rationals */
function gcd(a, b) { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) { const t = a % b; a = b; b = t; } return a; }
function Q(n, d) {
  n = BigInt(n); d = d === undefined ? 1n : BigInt(d);
  if (d === 0n) throw new Error('division by zero');
  if (d < 0n) { n = -n; d = -d; }
  const g = gcd(n, d) || 1n;
  return { n: n / g, d: d / g };
}
const qadd = (a, b) => Q(a.n * b.d + b.n * a.d, a.d * b.d);
const qsub = (a, b) => Q(a.n * b.d - b.n * a.d, a.d * b.d);
const qmul = (a, b) => Q(a.n * b.n, a.d * b.d);
const qdiv = (a, b) => { if (b.n === 0n) throw new Error('division by zero'); return Q(a.n * b.d, a.d * b.n); };
const qeq = (a, b) => a.n === b.n && a.d === b.d;
const qlt = (a, b) => a.n * b.d < b.n * a.d;

  if (k < 0n) { if (a.n === 0n) throw new Error('0 to a negative power'); return qpow(Q(a.d, a.n), -k); }

function qdec(s) {                          // "8.3", ".25", "290000" → exact
  const m = /^(\d*)(?:\.(\d*))?$/.exec(s);
  if (!m || (m[1] === '' && (m[2] === undefined || m[2] === ''))) throw new Error('not a number: ' + s);

      const tall = (a.b.t === 'par' || wrap) && hasFrac(a.b);

    }
    case 'mul': return a.xs.map(x => (x.t === 'add' || x.t === 'neg' && a.op === '') ? html(Par(x)) : html(x)).join(a.op === '' ? '' : '<span class="op">' + a.op + '</span>');
    case 'frac': return '<span class="fr"><span class="nu">' + html(a.n) + '</span><span class="de">' + html(a.d) + '</span></span>';
    case 'neg': return '−' + (a.x.t === 'add' ? html(Par(a.x)) : html(a.x));
    case 'par': return hasFrac(a.x) ? '<span class="bp">(</span>' + html(a.x) + '<span class="bp">)</span>' : '(' + html(a.x) + ')';
    case 'eq': return html(a.l) + '<span class="rel">=</span>' + html(a.r);
    case 'ar': return html(a.a) + '<span class="op">' + a.op + '</span>' + html(a.b);

function speak(a) {

/* ------------------------------------------------------------------ worked solutions: steps whose expressions all equal the question */
function solution(part) {
  const f = part.fam, x = part.prm; if (!f || !x) return null;
  const S = (say, ex) => ({ say, ex: ex || null });
  switch (f) {
    case 'prod': case 'monoProd': {
      const b = f === 'prod' ? x.b : V(x.v), bs = f === 'prod' ? String(x.b) : '<i>' + x.v + '</i>';
      return [S('Why it works: ' + m(P(b, x.m)) + ' is ' + x.m + ' factors of ' + bs + ' and ' + m(P(b, x.n)) + ' is ' + x.n + ' more, so that is ' + x.m + ' + ' + x.n + ' factors of ' + bs + ' in all.'),
        S('The bases are the same and they are multiplied: keep the base, add the exponents.', P(b, Ar(x.m, '+', x.n))),
        S(x.m + ' + ' + x.n + ' = ' + (x.m + x.n) + '.', P(b, x.m + x.n))];
    }
    case 'powpow': case 'monoPow': {
      const b = f === 'powpow' ? x.b : V(x.v);
      return [S('Why it works: ' + m(P(Par(P(b, x.m)), x.n)) + ' is ' + x.n + ' copies of ' + m(P(b, x.m)) + ' multiplied, which adds ' + x.m + ' a total of ' + x.n + ' times.'),
        S('A power of a power: keep the base, multiply the exponents.', P(b, Ar(x.m, '×', x.n))),

    case 'zero':

        S(m(P(x.p, x.k)) + ' = ' + times(x.p, x.k) + ' = ' + ipow(x.p, x.k).n + ', and ' + m(P(x.q, x.k)) + ' = ' + times(x.q, x.k) + ' = ' + ipow(x.q, x.k).n + '.', Fr(N(String(ipow(x.p, x.k).n)), N(String(ipow(x.q, x.k).n))))];
    case 'zeroMix':
      return [S(m(P(x.a, 0)) + ' = 1, because any number except 0 to the zero power is 1.', Mul('·', N(1), P(x.c, 2))),
        S(m(P(x.c, 2)) + ' = ' + x.c + ' · ' + x.c + ' = ' + x.c * x.c + ', and 1 · ' + x.c * x.c + ' = ' + x.c * x.c + '.', N(x.c * x.c))];
    case 'powquot':
      return [S('Power of a power first: multiply the exponents, ' + x.p + ' × ' + x.q + ' = ' + x.p * x.q + '.', Fr(P(x.B, x.p * x.q), P(x.B, x.r))),
        S('Same base, dividing: subtract the exponents, ' + x.p * x.q + ' − ' + x.r + ' = ' + x.e + '.', P(x.B, x.e)),
        S('Find the value: ' + m(P(x.B, x.e)) + ' = ' + (x.e === 1 ? String(x.B) : times(x.B, x.e) + ' = ' + ipow(x.B, x.e).n) + '.', N(String(ipow(x.B, x.e).n)))];

        S('Dividing powers with the same base subtracts the exponents.', Eq(P(x.b, Ar(n, '−', x.k)), P(x.b, x.c))),

        S('Check: ' + m(Fr(P(x.b, x.k + x.c), P(x.b, x.k))) + ' = ' + m(P(x.b, x.c)) + ' = ' + commas(String(x.V)) + ' ✓')];

      return [S('Only <i>' + x.v + '</i> has the negative exponent: ' + m(P(V(x.v), -x.n)) + ' = one over ' + m(P(V(x.v), x.n)) + '.', Mul('·', N(x.c), Fr(1, P(V(x.v), x.n)))),

    }
    case 'negNegBase': {
      const b = Par(Neg(N(x.c))), v = ipow(x.c, x.e).n;

    }
    case 'fracNeg': {
      const v = ipow(x.d, x.n).n;

        S(x.m + ' + (−' + x.n + ') = ' + x.m + ' − ' + x.n + ' = −' + (-s) + '.', P(x.B, s)),

    case 'monoQuot': {

        S(m(P(x.k, x.q)) + ' = ' + times(x.k, x.q) + ' = ' + kq + '. For <i>' + x.v + '</i>, multiply the exponents: (−' + x.p + ') × ' + x.q + ' = −' + x.p * x.q + ' (it stays negative).', Mul('', N(String(kq)), P(v, -x.p * x.q), P(w, x.q))),
        S('Move ' + m(P(v, -x.p * x.q)) + ' to the bottom, where its exponent turns positive.', Fr(Mul('', N(String(kq)), P(w, x.q)), P(v, x.p * x.q)))];
    }
    case 'toSci': {
      const val0 = qmul(qdec(x.c), ipow(10, x.k)), shown = commas(decStr(val0)), k = x.k;

        k > 0 ? S('From ' + shown + ' to ' + x.c + ', the decimal point moves ' + k + ' places to the left. ' + shown + ' is big, so the exponent is positive: ' + k + '.', Sci(x.c, k))

        S('Check: ' + m(Sci(x.c, k)) + ' means move the decimal point of ' + x.c + ' ' + Math.abs(k) + ' places ' + (k > 0 ? 'right' : 'left') + ', which gives back ' + shown + '. ✓')];

    case 'toStd': case 'eNote': {
      const val0 = qmul(qdec(x.c), ipow(10, x.k)), k = x.k;

  var h1 = $('h1'); if (h1 && document.activeElement && document.activeElement !== document.body && !(document.activeElement.closest && document.activeElement.closest('#paper'))) { h1.setAttribute('tabindex', '-1'); h1.focus({preventScroll: true}); }
}
function restoreOne(it){
  var a = S.ans[it.id]; if (a == null) return;
  if (it.type === 'text'){ var el = $('a' + it.id); if (el){ el.value = a; setPreview(el); } }
  else (it.type === 'mc' ? [a] : a).forEach(function(v){ var x = document.querySelector('input[name="q' + it.id + '"][value="' + v + '"]'); if (x) x.checked = true; });
}
function restore(){ ITEMS.forEach(restoreOne); }
function paintAll(){ paintScopes(); paintBar(); paintProgress(); ITEMS.forEach(paintItem); Object.keys(EX).forEach(function(k){ paintItem(EX[k]); }); paintScore(); }
$('bPause').addEventListener('click', pause);
$('bResume').addEventListener('click', start);
$('bFinish').addEventListener('click', function(){
  var left = ITEMS.length - ITEMS.filter(answered).length;
  ask((left ? left + ' of ' + ITEMS.length + ' still blank. ' : '') + (S.mode === 'test' ? 'Stop the clock and mark everything?' : 'Stop the clock and see your score?'), 'Yes, finish', finish);
});
Array.prototype.forEach.call(document.querySelectorAll('.mode button'), function(b){
  b.addEventListener('click', function(){
    var m = b.dataset.mode; if (m === S.mode) return;
    var go = function(){ var pos = S.pos; drop(key()); S = fresh(m); if (pos) S.pos = pos; render(); S.hash = HASHV; save(); paintAll(); };
    if (started()) ask('Switching starts this set over. Your answers will be cleared.', 'Switch', go); else go();
  });
});
$('scope').addEventListener('change', function(){ var v = this.value; if (v === scope) return;
  var to = v === 'all' ? (scope === 'all' ? seed : (load('lastAll') || seed)) : randomSeed();   /* [R2-N3] one part or misses: new numbers; back to the whole test you were on [B6] */
  var go = function(){ goSet(to, v); };
  if (started() && !S.done) ask('Switch to “' + SCOPES[v] + '”? This set stays saved on this device.', 'Switch', go); else go();
  $('scope').value = scope; });
$('setgo').addEventListener('click', function(){ var v = Math.floor(+$('setin').value); if (v >= 1 && v <= 99999) goSet(v, scope); else { $('setin').value = seed; } });
$('setin').addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); $('setgo').click(); } });
$('bNew').addEventListener('click', function(){ var go = function(){ goSet(randomSeed(), scope === 'miss' ? 'all' : scope); }; if (started() && !S.done) ask('Leave this set for a new one? This one stays saved on this device.', 'New set', go); else go(); });
$('bAgain').addEventListener('click', function(){ ask('Clear your answers to this set and start it again?', 'Start over', function(){ var m = S.mode, pos = S.pos; drop(key()); S = fresh(m); if (pos) S.pos = pos; render(); S.hash = HASHV; save(); paintAll(); window.scrollTo(0, 0); }); });
window.addEventListener('hashchange', function(){ var h = fromHash(); if (h && (h.seed !== seed || h.scope !== scope)) openSet(h.seed, h.scope); });
window.addEventListener('storage', function(e){                                       /* [R2-N4] two tabs on one set stay in step — without writing back [B1] */
  if (e.key !== PRE + key() || !e.newValue) return;
  var rec; try { rec = JSON.parse(e.newValue); } catch(x){ return; }
  if (!rec || rec.schema !== SCHEMA || rec.hash !== HASHV || (S.at && rec.at && rec.at <= S.at)) return;
  var y = window.scrollY, f = document.activeElement && document.activeElement.id;
  S = rec; S.running = false; S.startedAt = null; FLASH = {};
  render(); restore(); paintAll(); window.scrollTo(0, y); if (f && $(f)) $(f).focus({preventScroll: true});
});
setInterval(function(){ if (S && S.running) $('time').textContent = fmt(elapsed()); }, 250);
window.addEventListener('pagehide', function(){ if (S && S.running){ S.acc = elapsed(); S.startedAt = now(); save(); } });
document.addEventListener('visibilitychange', function(){ if (document.hidden && S && S.running) pause(); });   /* the clock stops when the page is put away */

/* the page's words, from the unit */
document.title = U.title;
$('eyebrow').innerHTML = U.eyebrow; $('h1').innerHTML = U.h1;
$('intro').innerHTML = U.intro + (U.notes || []).map(function(n){ return '<span class="pinote">' + n + '</span>'; }).join('');
openSet(seed, scope);
})();
</script>
